<!-- Runs the iglWebGPUTriangleWasm sample on the browser's WebGPU (see run_triangle_chrome.sh). -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>iglWebGPUTriangleWasm</title>
  </head>
  <body>
    <canvas id="frame" width="256" height="256"></canvas>
    <pre id="log"></pre>
    <script src="iglWebGPUTriangleWasm.js"></script>
    <script>
      const log = (text) => {
        document.getElementById('log').textContent += text + '\n';
        console.log(text);
      };
      (async () => {
        const size = 256;
        const bytes = size * size * 4;
        const module = await createIglTriangle();
        const ptr = module._malloc(bytes);
        const status = await module._igl_triangle(size, ptr);
        if (status !== 0) {
          log(`igl_triangle() failed: ${status}`);
          document.title = 'FAILED';
          return;
        }
        const frame = module.HEAPU8.slice(ptr, ptr + bytes);
        module._free(ptr);
        document
          .getElementById('frame')
          .getContext('2d')
          .putImageData(new ImageData(new Uint8ClampedArray(frame.buffer), size, size), 0, 0);
        const response = await fetch('reference.rgba');
        if (!response.ok) {
          log('rendered; no reference.rgba to compare with');
          document.title = 'RENDERED';
          return;
        }
        const reference = new Uint8Array(await response.arrayBuffer());
        let maxAbs = 0;
        let differing = 0;
        for (let i = 0; i < bytes; i += 4) {
          let d = 0;
          for (let c = 0; c < 4; ++c) {
            d = Math.max(d, Math.abs(frame[i + c] - reference[i + c]));
          }
          maxAbs = Math.max(maxAbs, d);
          differing += d > 0 ? 1 : 0;
        }
        const result = `maxAbs=${maxAbs} differing=${((100 * differing) / (size * size)).toFixed(4)}%`;
        log(result);
        document.title = result;
      })().catch((error) => {
        log(String(error));
        document.title = 'FAILED';
      });
    </script>
  </body>
</html>
